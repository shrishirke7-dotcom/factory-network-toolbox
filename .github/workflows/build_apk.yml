name: Build Factory Network APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # १. Java इन्स्टॉल करणे
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # २. थेट Git द्वारे Flutter SDK डाऊनलोड आणि इन्स्टॉल करणे (कोणताही एरर येणार नाही)
    - name: Install Flutter via Git
      run: |
        git clone https://github.com/flutter/flutter.git -b stable --depth 1 _flutter
        echo "$GITHUB_WORKSPACE/_flutter/bin" >> $GITHUB_PATH
        flutter --version

    # ३. पॅकेज डाऊनलोड करणे
    - name: Get Dependencies
      run: flutter pub get

    # ४. APK फाईल बिल्ड करणे
    - name: Build APK Release
      run: flutter build apk --release

    # ५. तयार झालेली APK फाईल डाऊनलोडसाठी उपलब्ध करणे
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: factory-network-apk
        path: build/app/outputs/flutter-apk/app-release.apk
