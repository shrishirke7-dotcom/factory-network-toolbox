name: Build Factory Network APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # थेट उबंटू सर्व्हरवर Java आणि Git द्वारे Flutter इन्स्टॉल करणे (कोणताही थर्ड-पार्टी प्लग-इन एरर नाही)
    - name: Install Java and Flutter
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk git
        git clone https://github.com/flutter/flutter.git -b stable --depth 1 _flutter
        echo "$GITHUB_WORKSPACE/_flutter/bin" >> $GITHUB_PATH

    - name: Get Dependencies
      run: flutter pub get

    - name: Build APK Release
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: factory-network-apk
        path: build/app/outputs/flutter-apk/app-release.apk
