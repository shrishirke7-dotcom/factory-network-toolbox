name: Build Factory Network APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # १. Java इन्स्टॉल करणे (v5 अपडेट केला आहे)
    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    # २. Flutter SDK सेट करणे
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    # ३. पॅकेज डाऊनलोड करणे
    - run: flutter pub get

    # ४. APK फाईल बिल्ड करणे
    - run: flutter build apk --release

    # ५. तयार झालेली APK फाईल डाऊनलोडसाठी उपलब्ध करणे
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: factory-network-apk
        path: build/app/outputs/flutter-apk/app-release.apk
